<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COMBACK NEWS Admin</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f8;font-family:"Noto Sans Devanagari",Arial}.bar{height:62px;background:#0b1220;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 25px}.wrap{width:min(1150px,94%);margin:22px auto}.panel,.stat{background:#fff;border:1px solid #e1e6ed;border-radius:9px;padding:17px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat b{font-size:28px;display:block}.stat small{color:#697386}.panel{margin-top:16px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}input,textarea{width:100%;padding:11px;border:1px solid #d8dee7;border-radius:6px;font:inherit}textarea{min-height:100px}button{border:0;border-radius:6px;padding:10px 15px;background:#e31b23;color:#fff;font-weight:800;cursor:pointer}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid #e5e7eb}.login{max-width:400px;margin:80px auto}.hidden{display:none}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}.table{display:block;overflow:auto}.bar{padding:0 12px}}</style></head><body><div class="bar"><b>COMBACK <span style="color:#ff3540">NEWS</span> — ADMIN</b><a href="index.html" style="color:#fff">← Website</a></div><div id="login" class="login panel"><h2>Admin Login</h2><p style="font-size:12px;color:#697386">Demo panel. Static GitHub Pages में data browser localStorage में रहता है।</p><input id="u" value="admin" placeholder="Username"><br><br><input id="p" type="password" placeholder="Password"><br><br><button onclick="login()">Login</button></div><div id="app" class="wrap hidden"><div class="stats"><div class="stat"><b id="count">0</b><small>Total Posts</small></div><div class="stat"><b>12</b><small>Categories</small></div><div class="stat"><b>5</b><small>Users</small></div><div class="stat"><b>25.4K</b><small>Total Views</small></div></div><div class="panel"><h2>नई खबर जोड़ें</h2><form class="form" onsubmit="save(event)"><input id="title" class="full" required placeholder="Headline"><input id="cat" required placeholder="Category"><input id="img" required placeholder="Image URL"><textarea id="desc" class="full" placeholder="Short description"></textarea><button class="full">Publish News</button></form></div><div class="panel"><h2>Published Posts</h2><table class="table"><thead><tr><th>Title</th><th>Category</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div><script>const def=[{id:1,cat:"देश",title:"देश-दुनिया की बड़ी खबरें अब एक ही जगह",desc:"महत्वपूर्ण समाचार",img:"https://images.unsplash.com/photo-1529107386315-e1a2ed48a620?auto=format&fit=crop&w=900&q=80"},{id:2,cat:"बिजनेस",title:"शेयर बाजार और डिजिटल कारोबार से जुड़े अहम अपडेट",desc:"बाजार अपडेट",img:"https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?auto=format&fit=crop&w=900&q=80"}];function get(){return JSON.parse(localStorage.getItem('cn_news')||'null')||def}function set(x){localStorage.setItem('cn_news',JSON.stringify(x))}function login(){if(u.value==='admin'&&p.value==='admin123'){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');render()}else alert('Demo login: admin / admin123')}function render(){let x=get();count.textContent=x.length;rows.innerHTML=x.map(n=>'<tr><td>'+n.title+'</td><td>'+n.cat+'</td><td>Published</td><td><button onclick="del('+n.id+')">Delete</button></td></tr>').join('')}function save(e){e.preventDefault();let x=get();x.unshift({id:Date.now(),title:title.value,cat:cat.value,img:img.value,desc:desc.value});set(x);e.target.reset();render();alert('News published!')}function del(id){set(get().filter(n=>n.id!==id));render()}</script></body></html>
